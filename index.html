<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="max-w-xl mx-auto my-8 border rounded shadow-lg overflow-hidden">
        <div class="bg-gradient-to-r from-indigo-500 to-teal-400 text-white flex justify-center items-center h-20 sm:h-28 lg:bg-green-500">
            <h1 class="text-2xl sm:text-4xl font-bold">
                TAILWIND CSS
            </h1>
        </div>
        <div class="p-4 sm:p-6 text-center">
            <h2 class="m-2 text-lg sm:text-xl font-semibold">
                Preeti Chablani
            </h2>
            <p class="text-sm sm:text-base text-gray-700">
                I am a passionate web developer who loves turning creative ideas into responsive and interactive websites.
            </p>
            <form class="mt-4">
                <div class="flex flex-col sm:flex-row sm:items-center gap-2">
                    <input type="text"placeholder="Enter Your Name"id="name"class="flex-1 p-2 bg-slate-200 rounded">
                </div>
                <button type="submit"class="mt-4 bg-blue-500 mx-auto text-white p-2 rounded w-32 sm:w-full" id="submitbtn">Submit</button>
            </form>
            <p class="mt-3 font-semibold" id="submittext"></p>
        </div>
    </div>
    <script>
        const nameInput = document.getElementById('name');
        const submitBtn = document.getElementById('submitbtn');
        const submitText = document.getElementById('submittext');
        submitBtn.addEventListener('click', function(event) {
            event.preventDefault();
            const name = nameInput.value.trim();
            if (name !== "") {
                submitText.textContent =
                    `Thank you for submitting, ${name}!`;
                submitText.classList.add('text-green-500');
            } else {
                submitText.textContent =
                    "Please enter your name.";
                submitText.classList.add('text-red-500');
            }
        });
    </script>
</body>
</html>
